name: Compilar Fluency para Firefox

on:
  push:
    branches:
      - main-firefox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    name: Firefox desktop (Manifest V2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter personalização
        uses: actions/checkout@v4

      - name: Baixar fonte do asbplayer
        uses: actions/checkout@v4
        with:
          repository: asbplayer/asbplayer
          ref: 2ccb722a88776958788b6b049a9e90bc675c0504
          path: asbplayer
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: asbplayer/pnpm-lock.yaml

      - name: Aplicar seleção de trechos
        run: node apply_patch.mjs asbplayer

      - name: Aplicar modelo Fluency
        run: node apply_fluency_patch.mjs asbplayer

      - name: Aplicar editor de múltiplas expressões
        run: node apply_multi_patch.mjs asbplayer

      - name: Aplicar consultas em background
        run: node apply_lookup_patch.mjs asbplayer

      - name: Verificar consultas em background
        run: node tests/check-background-lookup.mjs asbplayer

      - name: Integrar ponte de dicionário
        run: node apply_bridge_patch.mjs asbplayer

      - name: Verificar consulta em iframe
        run: node tests/check-iframe-lookup.mjs asbplayer

      - name: Aplicar dicionários externos
        run: node apply_remote_patch.mjs asbplayer

      - name: Verificar consultas somente online
        run: node tests/check-remote-only.mjs asbplayer

      - name: Verificar entrada livre de expressões
        run: node tests/check-arbitrary-terms.mjs asbplayer

      - name: Aplicar editor de definições
        run: node apply_clean_patch.mjs asbplayer

      - name: Testar integração de definições
        run: node --experimental-strip-types tests/check-lookup-bridge.mts

      - name: Testar modelo ilimitado
        run: node --experimental-strip-types tests/check-unlimited.mts

      - name: Testar dicionário e fontes
        run: node tests/check-dictionary-selection.mjs asbplayer

      - name: Testar editor limpo
        run: node tests/check-clean-editor.mjs asbplayer

      - name: Testar integração Anki
        run: node tests/check-anki-connect.mjs asbplayer

      - name: Testar cartões multi-expressões
        run: node tests/check-multi-card.mjs asbplayer

      - name: Identificar extensão Firefox
        run: node apply_firefox_patch.mjs asbplayer main

      - name: Instalar dependências
        working-directory: asbplayer
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        working-directory: asbplayer
        run: pnpm --filter @project/extension run compile

      - name: Compilar para Firefox
        working-directory: asbplayer
        run: pnpm --filter @project/extension run build:firefox

      - name: Validar manifesto e identidade Firefox
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'asbplayer/extension/.output/firefox-mv2/manifest.json';
          const m = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (m.manifest_version !== 2) throw Error('Expected Firefox MV2');
          if (m.browser_specific_settings?.gecko?.id !== 'asbplayer-fluency-firefox@oyayasu.github') throw Error('Unexpected Gecko ID');
          if (!m.sidebar_action) throw Error('Missing Firefox sidebar');
          for (const name of ['sidePanel', 'offscreen', 'tabCapture']) {
            if (m.permissions?.includes(name)) throw Error('Chromium-only permission: ' + name);
          }
          console.log('Firefox manifest valid:', m.name);
          NODE

      - name: Publicar pacote para testes
        uses: actions/upload-artifact@v4
        with:
          name: ASBPLAYER-FLUENCY-FIREFOX
          path: asbplayer/extension/.output/firefox-mv2/
          if-no-files-found: error
          retention-days: 14
